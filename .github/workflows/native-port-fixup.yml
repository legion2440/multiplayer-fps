name: Native client port validation

on:
  push:
    branches:
      - native-ui-port
    paths:
      - .github/workflows/native-port-fixup.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-ui-port
          fetch-depth: 0

      - name: Apply native client finalization
        shell: python
        run: |
          from pathlib import Path
          import shutil

          cargo_path = Path('Cargo.toml')
          cargo = cargo_path.read_text()
          cargo = cargo.replace('rust-version = "1.87"', 'rust-version = "1.74"')
          cargo = cargo.replace('macroquad = "=0.4.16"', 'macroquad = "=0.4.13"')
          cargo = cargo.replace('macroquad = "=0.4.14"', 'macroquad = "=0.4.13"')
          cargo = cargo.replace('fontdue = "=0.9.3"\n', '')
          cargo_path.write_text(cargo)

          client_path = Path('src/bin/client.rs')
          client = client_path.read_text()
          compat = '''\nfn draw_text<T: AsRef<str>>(\n    text: T,\n    x: f32,\n    y: f32,\n    font_size: f32,\n    color: Color,\n) -> TextDimensions {\n    macroquad::prelude::draw_text(text.as_ref(), x, y, font_size, color)\n}\n'''
          if 'fn draw_text<T: AsRef<str>>' not in client:
              marker = 'const DEFAULT_SERVER: &str = "127.0.0.1:34254";\n'
              if marker not in client:
                  raise SystemExit('client insertion marker not found')
              client = client.replace(marker, compat + '\n' + marker, 1)
          client = client.replace(
              'draw_dark_button(gateway, shorten(&gateway_text, 20), false);',
              'draw_dark_button(gateway, &shorten(&gateway_text, 20), false);',
          )
          client = client.replace(
              '#[derive(Debug, Clone, Copy)]\nstruct Palette {',
              '#[derive(Debug, Clone, Copy)]\n#[allow(dead_code)]\nstruct Palette {',
          )
          client = client.replace(
              'io::Error::new(io::ErrorKind::Other, error)',
              'io::Error::other(error)',
          )
          client = client.replace(
              '.map_err(|error| io::Error::other(error))',
              '.map_err(io::Error::other)',
          )
          client_path.write_text(client)

          maze_path = Path('src/maze.rs')
          maze_path.write_text(maze_path.read_text().replace('size.is_multiple_of(2)', 'size % 2 == 0'))

          server_path = Path('src/bin/server.rs')
          server = server_path.read_text().replace(
              'tick.is_multiple_of(SNAPSHOT_EVERY_TICKS)',
              'tick % SNAPSHOT_EVERY_TICKS == 0',
          )
          old = '''            ClientMessage::NextLevel => {\n                if address_to_id.contains_key(&source) && Instant::now() >= *level_change_allowed_at\n                {\n                    *level_index = (*level_index + 1) % levels.len();\n                    reset_for_level(players, &levels[*level_index]);\n                    *level_change_allowed_at = Instant::now() + Duration::from_secs(2);\n                    broadcast_raw(socket, players, &level_packet(*level_index));\n                    println!(\n                        "[level] {} - {} ({} dead ends)",\n                        *level_index + 1,\n                        levels[*level_index].name,\n                        levels[*level_index].dead_ends()\n                    );\n                }\n            }\n'''
          new = old + '''            ClientMessage::SetLevel(requested) => {\n                if address_to_id.contains_key(&source)\n                    && requested < levels.len()\n                    && Instant::now() >= *level_change_allowed_at\n                {\n                    *level_index = requested;\n                    reset_for_level(players, &levels[*level_index]);\n                    *level_change_allowed_at = Instant::now() + Duration::from_secs(2);\n                    broadcast_raw(socket, players, &level_packet(*level_index));\n                    println!(\n                        "[level] {} - {} ({} dead ends)",\n                        *level_index + 1,\n                        levels[*level_index].name,\n                        levels[*level_index].dead_ends()\n                    );\n                }\n            }\n'''
          if 'ClientMessage::SetLevel(requested)' not in server:
              if old not in server:
                  raise SystemExit('NextLevel block not found')
              server = server.replace(old, new)
          server_path.write_text(server)

          shutil.rmtree('frontend', ignore_errors=True)

          gitignore_path = Path('.gitignore')
          gitignore = '\n'.join(
              line for line in gitignore_path.read_text().splitlines()
              if not line.startswith('frontend/') and line != '!frontend/.env.example'
          ) + '\n'
          gitignore_path.write_text(gitignore)

          protocol_doc = Path('PROTOCOL.md')
          doc = protocol_doc.read_text()
          if 'SETLEVEL|<level_index>' not in doc:
              doc = doc.replace('NEXT\nLEAVE', 'NEXT\nSETLEVEL|<level_index>\nLEAVE')
          protocol_doc.write_text(doc)

          Path('README.md').write_text('''# multiplayer-fps - Maze Wars\n\nA native Rust recreation of Maze Wars for the 01-edu `multiplayer-fps` subject. Multiplayer uses a central authoritative UDP server and a Macroquad desktop client.\n\n## Features\n\n- First-person Maze Wars-style renderer with eye-shaped opponents.\n- Full-world minimap with live position and facing direction.\n- On-screen FPS and frame-time display.\n- Real UDP client/server networking.\n- Server accepts up to 64 network clients.\n- GUI connection screen for server IP, username and saved host aliases.\n- Three built-in levels with strictly increasing dead-end counts.\n- Server-authoritative movement, collision, shooting, damage, score, death and respawn.\n- Client prediction and remote-player interpolation.\n- Mouse look, left-click/Space fire, reload and weapon HUD.\n- Scoreboard, settings and multiple visual themes.\n- Native level editor and procedural maze generation.\n- Server-side AI players with maze pathfinding and line-of-sight combat.\n\n## Requirements\n\n- Rust 1.74+ (edition 2021).\n- Desktop environment supported by Macroquad.\n\n## Run\n\nStart the server:\n\n```bash\ncargo run --release --bin server\n```\n\nDefault bind:\n\n```text\n0.0.0.0:34254\n```\n\nOptional:\n\n```bash\ncargo run --release --bin server -- --bind 0.0.0.0:34254 --bots 3 --level 1\n```\n\nStart each client:\n\n```bash\ncargo run --release --bin client\n```\n\nor:\n\n```bash\ncargo run --release\n```\n\nThe connection screen accepts either a bare IP such as `127.0.0.1` or an explicit endpoint such as `127.0.0.1:34254`.\n\nDuplicate display names are supported; network identity uses server-assigned player IDs.\n\n## Controls\n\n| Input | Action |\n| --- | --- |\n| `W / S` | Move forward / backward |\n| `A / D` | Strafe |\n| Mouse | Look |\n| `Q / E` or arrow keys | Keyboard turning |\n| Left mouse / `Space` | Shoot |\n| `R` | Reload |\n| `Tab` | Scoreboard |\n| `Esc` | Release mouse / return to connection screen |\n\nUse the top bar for built-in levels, procedural generation, gateway, editor, scoreboard and settings.\n\n## Level editor\n\nOpen **LEVEL EDITOR** from the connection screen.\n\n- Left mouse: toggle a wall cell.\n- `G`: generate a procedural maze.\n- Size control: cycle maze sizes.\n- `S`: save `custom_level.json`.\n- `L`: load `custom_level.json`.\n- `Esc`: return.\n\n## Multiplayer test\n\nFor a local multi-client run:\n\n```bash\ncargo run --release --bin server -- --bots 0\n```\n\nLaunch 10+ clients and connect them to:\n\n```text\n127.0.0.1:34254\n```\n\nFor LAN play, keep the server on `0.0.0.0:34254` and connect clients to the server machine's LAN IP.\n\n## Checks\n\n```bash\ncargo fmt --all -- --check\ncargo check --all-targets --locked\ncargo test --locked\ncargo clippy --all-targets --locked -- -D warnings\ncargo build --release --bins --locked\n```\n\nCI also compiles all targets on Rust 1.74. The UDP integration test starts 10 independent clients with the same display name, validating connection capacity and server-assigned identity. Level tests verify strictly increasing dead-end counts.\n\n## Architecture\n\n```text\nsrc/\n├── lib.rs\n├── maze.rs         maze generation, collision, ray casting, BFS\n├── protocol.rs     UDP packet encoding/decoding\n└── bin/\n    ├── server.rs   authoritative 60 Hz UDP server + AI\n    └── client.rs   native Macroquad UDP client + UI/rendering/editor\n```\n\nSee `PROTOCOL.md` for the UDP wire format.\n''')

      - name: Pin compatible dependency graph
        run: |
          cargo update -p macroquad --precise 0.4.13
          sed -i '0,/^version = 4$/s//version = 3/' Cargo.lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: dtolnay/rust-toolchain@1.74.0

      - name: Validate Rust 1.74
        run: cargo +1.74.0 check --all-targets --locked

      - name: Validate stable
        run: |
          cargo +stable fmt --all
          cargo +stable fmt --all -- --check
          cargo +stable test --locked
          cargo +stable clippy --all-targets --locked -- -D warnings
          RUSTFLAGS=-Dwarnings cargo +stable build --release --bins --locked

      - name: Commit validated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize native multiplayer client"
          git push origin HEAD:native-ui-port
