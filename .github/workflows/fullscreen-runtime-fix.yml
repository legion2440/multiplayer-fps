name: Runtime fullscreen fix

on:
  push:
    branches:
      - fullscreen-runtime-fix
    paths:
      - .github/workflows/fullscreen-runtime-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fullscreen-runtime-fix
          fetch-depth: 0

      - name: Apply window fix
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/bin/client.rs")
          text = path.read_text()

          old = "        high_dpi: true,\n        fullscreen: true,\n        window_resizable: true,\n"
          new = "        high_dpi: true,\n        fullscreen: false,\n        window_resizable: true,\n"
          if old not in text:
              raise SystemExit("window config pattern not found")
          text = text.replace(old, new, 1)

          old = "    set_cursor_grab(false);\n    show_mouse(true);\n    let mut fullscreen = true;\n\n    loop {\n        if is_key_pressed(KeyCode::F11) {\n            fullscreen = !fullscreen;\n            set_fullscreen(fullscreen);\n        }\n        clear_background(Color::new(0.008, 0.011, 0.02, 1.0));\n        screen = match screen {\n            AppScreen::Connect(connect) => update_connect(connect),\n            AppScreen::Game(game) => update_game(game),\n            AppScreen::Editor(editor) => update_editor(editor),\n        };\n        next_frame().await;\n    }\n"
          new = "    set_cursor_grab(false);\n    show_mouse(true);\n\n    // Create a normal resizable Windows window first. With miniquad 0.4.6,\n    // startup fullscreen can leave a decorated fixed-size window. Apply\n    // fullscreen only after the native window has completed one frame.\n    clear_background(Color::new(0.008, 0.011, 0.02, 1.0));\n    screen = match screen {\n        AppScreen::Connect(connect) => update_connect(connect),\n        AppScreen::Game(game) => update_game(game),\n        AppScreen::Editor(editor) => update_editor(editor),\n    };\n    next_frame().await;\n    set_fullscreen(true);\n    let mut fullscreen = true;\n\n    loop {\n        if is_key_pressed(KeyCode::F11) {\n            fullscreen = !fullscreen;\n            set_fullscreen(fullscreen);\n        }\n        clear_background(Color::new(0.008, 0.011, 0.02, 1.0));\n        screen = match screen {\n            AppScreen::Connect(connect) => update_connect(connect),\n            AppScreen::Game(game) => update_game(game),\n            AppScreen::Editor(editor) => update_editor(editor),\n        };\n        next_frame().await;\n    }\n"
          if old not in text:
              raise SystemExit("main loop pattern not found")
          path.write_text(text.replace(old, new, 1))

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@1.74.0

      - name: Format
        run: cargo +stable fmt --all
      - name: Rust 1.74 check
        run: cargo +1.74.0 check --locked --all-targets
      - name: Test
        run: cargo +stable test --locked
      - name: Clippy
        run: cargo +stable clippy --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo +stable build --release --locked --bin server --bin client

      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/workflows/fullscreen-runtime-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/client.rs .github/workflows/fullscreen-runtime-fix.yml
          git commit -m "fix: apply fullscreen after native window creation"
          git push origin HEAD:fullscreen-runtime-fix
