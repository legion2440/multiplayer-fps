name: Apply pending audit fixes

on:
  push:
    paths:
      - .github/workflows/apply-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          cargo = read('Cargo.toml')
          if 'rust-version' not in cargo:
              cargo = cargo.replace('edition = "2021"\n', 'edition = "2021"\nrust-version = "1.87"\n')
          cargo = cargo.replace('macroquad = "0.4.14"', 'macroquad = "=0.4.16"')
          write('Cargo.toml', cargo)

          server = read('src/bin/server.rs')
          duplicate_start = server.find('                if players\n                    .values()\n                    .any(|player| player.name.eq_ignore_ascii_case(&name))')
          if duplicate_start != -1:
              duplicate_end = server.find('                let id = *next_id;', duplicate_start)
              if duplicate_end == -1:
                  raise SystemExit('duplicate-name block end not found')
              server = server[:duplicate_start] + server[duplicate_end:]
          write('src/bin/server.rs', server)

          client = read('src/bin/client.rs')
          client = client.replace(
              'struct GameState {\n    network: NetworkClient,',
              'struct GameState {\n    server: String,\n    username: String,\n    network: NetworkClient,'
          )
          client = client.replace(
              '    status: String,\n}',
              '    status: String,\n    display_fps: f32,\n}',
              1
          )
          client = client.replace(
              '            return AppScreen::Game(GameState {\n                network: pending.network,',
              '            return AppScreen::Game(GameState {\n                server: screen.server.clone(),\n                username: screen.username.clone(),\n                network: pending.network,'
          )
          client = client.replace(
              '                status: "Connected".to_string(),\n            });',
              '                status: "Connected".to_string(),\n                display_fps: 60.0,\n            });'
          )
          client = client.replace(
              'fn update_game(mut game: GameState) -> AppScreen {\n    let dt = get_frame_time().min(0.05);',
              'fn update_game(mut game: GameState) -> AppScreen {\n    let dt = get_frame_time().min(0.05);\n    let instant_fps = 1.0 / dt.max(0.0001);\n    let fps_alpha = 1.0 - (-dt / 0.5).exp();\n    game.display_fps += (instant_fps - game.display_fps) * fps_alpha;'
          )
          client = client.replace(
              '            server: DEFAULT_SERVER.to_string(),\n            username: "Agent".to_string(),',
              '            server: game.server.clone(),\n            username: game.username.clone(),'
          )
          client = client.replace(
              '    let fps = get_fps();',
              '    let fps = game.display_fps.round() as i32;'
          )
          old_connect = '''fn start_connection(server: &str, username: &str) -> io::Result<NetworkClient> {\n    let socket = UdpSocket::bind("0.0.0.0:0")?;\n    socket.connect(server.trim())?;'''
          new_connect = '''fn start_connection(server: &str, username: &str) -> io::Result<NetworkClient> {\n    let socket = UdpSocket::bind("0.0.0.0:0")?;\n    let server = server.trim();\n    let endpoint = if server.parse::<std::net::IpAddr>().is_ok() {\n        format!("{server}:34254")\n    } else {\n        server.to_string()\n    };\n    socket.connect(&endpoint)?;'''
          if old_connect not in client:
              raise SystemExit('start_connection pattern not found')
          client = client.replace(old_connect, new_connect)
          write('src/bin/client.rs', client)

          # The built-in Macroquad font does not reliably render long dash glyphs.
          for path in [Path('README.md'), Path('PROTOCOL.md'), *Path('src').rglob('*.rs')]:
              text = path.read_text().replace('—', '-').replace('–', '-')
              path.write_text(text)

          # Reuse one test to prove both 10-client capacity and duplicate display names.
          network = read('tests/network.rs')
          network = network.replace('            .send(format!("JOIN|audit_{index}\\n").as_bytes())', '            .send(b"JOIN|Agent\\n")')
          write('tests/network.rs', network)

          ci = read('.github/workflows/ci.yml')
          if '\n  msrv:\n' not in ci:
              ci += '''\n  msrv:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: dtolnay/rust-toolchain@1.87.0\n      - name: Rust 1.87 check\n        run: cargo check --all-targets --locked\n\n  frontend:\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: frontend\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - name: Install dependencies\n        run: npm install\n      - name: Build frontend\n        run: npm run build\n'''
              write('.github/workflows/ci.yml', ci)

      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.87.0
          rustup toolchain install stable --component clippy,rustfmt

      - name: Validate Rust MSRV
        run: cargo +1.87.0 check --all-targets --locked

      - name: Validate Rust stable
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable test --locked
          cargo +stable clippy --all-targets --locked -- -D warnings
          RUSTFLAGS=-Dwarnings cargo +stable build --release --bins --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Commit fixes
        run: |
          rm .github/workflows/apply-audit-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address audit feedback after frontend port"
          git push origin HEAD:main
