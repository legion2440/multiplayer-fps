name: Window and input fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/window-input-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply window and text-input fixes
        shell: python
        run: |
          from pathlib import Path

          client = Path("src/bin/client.rs")
          text = client.read_text()

          windows_imports = '''#[cfg(target_os = "windows")]
          use std::ptr;
          #[cfg(target_os = "windows")]
          use winapi::shared::windef::HWND;
          #[cfg(target_os = "windows")]
          use winapi::um::winuser::{
              FindWindowW, GetMonitorInfoW, MonitorFromWindow, SetWindowLongPtrW, SetWindowPos, GWL_EXSTYLE,
              GWL_STYLE, HWND_TOP, MONITORINFO, MONITOR_DEFAULTTONEAREST, SWP_FRAMECHANGED, SWP_SHOWWINDOW,
              WS_EX_APPWINDOW, WS_POPUP, WS_VISIBLE,
          };

          '''
          if windows_imports not in text:
              raise SystemExit("Windows fullscreen imports not found")
          text = text.replace(windows_imports, "", 1)

          old_conf = '''        high_dpi: true,
                  fullscreen: false,
                  window_resizable: false,
          '''
          new_conf = '''        high_dpi: true,
                  fullscreen: false,
                  window_resizable: true,
          '''
          if old_conf not in text:
              raise SystemExit("Window configuration not found")
          text = text.replace(old_conf, new_conf, 1)

          helper_start = text.find('#[cfg(target_os = "windows")]\nfn force_fullscreen()')
          helper_end_marker = '''#[cfg(not(target_os = "windows"))]
          fn force_fullscreen() {
              set_fullscreen(true);
          }

          '''
          if helper_start == -1:
              raise SystemExit("Windows fullscreen helper not found")
          helper_end = text.find(helper_end_marker, helper_start)
          if helper_end == -1:
              raise SystemExit("Fallback fullscreen helper not found")
          helper_end += len(helper_end_marker)
          text = text[:helper_start] + text[helper_end:]

          main_call = '''    set_cursor_grab(false);
              show_mouse(true);
              force_fullscreen();

          '''
          main_new = '''    set_cursor_grab(false);
              show_mouse(true);

          '''
          if main_call not in text:
              raise SystemExit("Fullscreen call not found")
          text = text.replace(main_call, main_new, 1)

          connect_old = '''fn connect_after_game(game: &GameState, status: &str) -> AppScreen {
              AppScreen::Connect(ConnectScreen {
          '''
          connect_new = '''fn connect_after_game(game: &GameState, status: &str) -> AppScreen {
              // Do not let character events queued while releasing the gameplay cursor
              // leak into the address field on the first gateway frame.
              while get_char_pressed().is_some() {}
              AppScreen::Connect(ConnectScreen {
          '''
          if connect_old not in text:
              raise SystemExit("connect_after_game not found")
          text = text.replace(connect_old, connect_new, 1)

          edit_old = '''fn edit_active_field(screen: &mut ConnectScreen) {
              let target = match screen.active {
                  ActiveField::Server => &mut screen.server,
                  ActiveField::Username => &mut screen.username,
                  ActiveField::Alias => &mut screen.alias,
              };
              while let Some(ch) = get_char_pressed() {
                  if !ch.is_control() && target.len() < 64 {
                      target.push(ch);
                  }
              }
              if is_key_pressed(KeyCode::Backspace) {
                  target.pop();
              }
          }
          '''
          edit_new = '''fn field_accepts_char(field: ActiveField, ch: char) -> bool {
              match field {
                  ActiveField::Server => {
                      ch.is_ascii_alphanumeric() || matches!(ch, '.' | ':' | '-' | '_' | '[' | ']' | '%')
                  }
                  ActiveField::Username | ActiveField::Alias => {
                      ch.is_alphanumeric() || matches!(ch, ' ' | '_' | '-' | '.')
                  }
              }
          }

          fn edit_active_field(screen: &mut ConnectScreen) {
              let active = screen.active;
              let target = match active {
                  ActiveField::Server => &mut screen.server,
                  ActiveField::Username => &mut screen.username,
                  ActiveField::Alias => &mut screen.alias,
              };

              // Sanitize both persisted text and fresh character events. Macroquad/miniquad
              // can leave non-text key events in the character queue after Esc on Windows.
              target.retain(|ch| field_accepts_char(active, ch));
              while let Some(ch) = get_char_pressed() {
                  if field_accepts_char(active, ch) && target.len() < 64 {
                      target.push(ch);
                  }
              }
              if is_key_pressed(KeyCode::Backspace) {
                  target.pop();
              }
          }
          '''
          if edit_old not in text:
              raise SystemExit("edit_active_field not found")
          text = text.replace(edit_old, edit_new, 1)

          client.write_text(text)

          cargo = Path("Cargo.toml")
          cargo_text = cargo.read_text()
          win_dep = '''
          [target.'cfg(windows)'.dependencies]
          winapi = { version = "0.3.9", features = ["winuser"] }
          '''
          if win_dep not in cargo_text:
              raise SystemExit("Direct Win32 dependency not found")
          cargo.write_text(cargo_text.replace(win_dep, "", 1))

          lock = Path("Cargo.lock")
          lock_text = lock.read_text()
          root_dep = ''' "serde_json",
           "winapi",
          ]'''
          if root_dep not in lock_text:
              raise SystemExit("Root winapi lock dependency not found")
          lock.write_text(lock_text.replace(root_dep, ' "serde_json",\n]', 1))

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@1.74.0

      - name: Format
        run: cargo +stable fmt --all
      - name: Rust 1.74 check
        run: cargo +1.74.0 check --locked --all-targets
      - name: Test
        run: cargo +stable test --locked
      - name: Clippy
        run: cargo +stable clippy --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo +stable build --release --locked --bin server --bin client
      - name: Windows type-check
        run: |
          rustup target add x86_64-pc-windows-gnu --toolchain 1.74.0
          cargo +1.74.0 check --locked --target x86_64-pc-windows-gnu --bin client

      - name: Commit validated fix
        run: |
          rm .github/workflows/window-input-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/client.rs Cargo.toml Cargo.lock .github/workflows/window-input-fix.yml
          git commit -m "fix: restore resizable window and sanitize gateway input"
          git push origin HEAD:main
