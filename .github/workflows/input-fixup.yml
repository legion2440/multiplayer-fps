              raise SystemExit('level handler missing')
          client = client.replace(level_handler, level_handler + custom_handler, 1)

          hud_old = '''    draw_text("CHARGE", hull.x + 12.0, hull.y + 54.0, 12.0, palette.muted);\n    let ammo_text = if game.reload_timer > 0.0 {\n        "RELOADING".to_string()\n    } else {\n        format!("{}/{}", game.ammo, MAX_AMMO)\n    };\n    draw_text(\n        ammo_text,\n        hull.x + hull.w - 78.0,\n        hull.y + 54.0,\n        12.0,\n        palette.accent,\n    );\n    let ammo_ratio = if game.reload_timer > 0.0 {\n        1.0 - game.reload_timer.clamp(0.0, 1.0)\n    } else {\n        game.ammo as f32 / MAX_AMMO as f32\n    };\n    draw_bar(\n        Rect::new(hull.x + 12.0, hull.y + 61.0, hull.w - 24.0, 8.0),\n        ammo_ratio,\n        palette.accent,\n    );\n'''
          hud_new = '''    draw_text("WEAPON", hull.x + 12.0, hull.y + 54.0, 12.0, palette.muted);\n    draw_text(\n        "READY",\n        hull.x + hull.w - 58.0,\n        hull.y + 54.0,\n        12.0,\n        palette.accent,\n    );\n    draw_bar(\n        Rect::new(hull.x + 12.0, hull.y + 61.0, hull.w - 24.0, 8.0),\n        1.0,\n        palette.accent,\n    );\n'''
          if hud_old not in client:
              raise SystemExit('ammo HUD block missing')
          client = client.replace(hud_old, hud_new, 1)
          client = client.replace(
              '"WASD Move   Mouse / arrows Turn   Space / Click Fire   R Reload   TAB Leaderboard";',
              '"WASD Move   Mouse / arrows Turn   Space / Click Fire   TAB Leaderboard";',
              1,
          )
          client = client.replace(
              '        "L{} / 3   {} dead ends",\n        game.level_index + 1,\n        maze.dead_ends()',
              '        "L{} / {}   {} dead ends",\n        game.level_index + 1,\n        game.levels.len(),\n        maze.dead_ends()',
              1,
          )
          client = client.replace(
              '    draw_dark_button(editor_button_rect(), "EDITOR", false);',
              '    draw_dark_button(\n        editor_button_rect(),\n        "CUSTOM",\n        game.level_index == 3,\n    );',
              1,
          )

          fire_old = '''fn fire_weapon(game: &mut GameState) {\n    if game.health <= 0 || game.reload_timer > 0.0 {\n        return;\n    }\n    if game.ammo <= 0 {\n        game.reload_timer = 1.0;\n        return;\n    }\n    game.network.seq = game.network.seq.wrapping_add(1);\n    let packet = encode_client(&ClientMessage::Shoot(game.network.seq));\n    let _ = game.network.socket.send(packet.as_bytes());\n    game.ammo -= 1;\n    game.shot_flash = 0.12;\n    if game.ammo == 0 {\n        game.reload_timer = 1.0;\n    }\n}\n'''
          fire_new = '''fn fire_weapon(game: &mut GameState) {\n    if game.health <= 0 {\n        return;\n    }\n    game.network.seq = game.network.seq.wrapping_add(1);\n    let packet = encode_client(&ClientMessage::Shoot(game.network.seq));\n    let _ = game.network.socket.send(packet.as_bytes());\n    game.shot_flash = 0.12;\n}\n\nfn request_custom_level(game: &mut GameState, maze: Maze, status: &str) {\n    let packet = encode_client(&ClientMessage::CustomLevel(maze));\n    match game.network.socket.send(packet.as_bytes()) {\n        Ok(_) => game.status = status.to_string(),\n        Err(error) => game.status = format!("Custom level send failed: {error}"),\n    }\n}\n\nfn load_custom_level_file() -> io::Result<Maze> {\n    let json = fs::read_to_string(CUSTOM_LEVEL_FILE)?;\n    let maze = serde_json::from_str::<Maze>(&json).map_err(io::Error::other)?;\n    if maze.cells.len() != maze.width.saturating_mul(maze.height)\n        || !(7..=31).contains(&maze.width)\n        || !(7..=31).contains(&maze.height)\n        || maze.width % 2 == 0\n        || maze.height % 2 == 0\n    {\n        return Err(io::Error::new(\n            io::ErrorKind::InvalidData,\n            "invalid maze dimensions",\n        ));\n    }\n    Ok(maze)\n}\n'''
          if fire_old not in client:
              raise SystemExit('fire_weapon block missing')
          client = client.replace(fire_old, fire_new, 1)

          normalize_old = '''fn normalized_server(server: &str) -> String {\n    let server = server.trim();\n    if server.parse::<std::net::IpAddr>().is_ok() {\n        format!("{server}:34254")\n    } else {\n        server.to_string()\n    }\n}\n'''
          normalize_new = '''fn normalized_server(server: &str) -> String {\n    let server = server.trim();\n    match server.parse::<std::net::IpAddr>() {\n        Ok(std::net::IpAddr::V4(address)) => format!("{address}:34254"),\n        Ok(std::net::IpAddr::V6(address)) => format!("[{address}]:34254"),\n        Err(_) => server.to_string(),\n    }\n}\n'''
          if normalize_old not in client:
              raise SystemExit('normalized_server block missing')
          client = client.replace(normalize_old, normalize_new, 1)

          host_old = '''fn server_host(server: &str) -> String {\n    server.split(':').next().unwrap_or(server).to_string()\n}\n'''
          host_new = '''fn server_host(server: &str) -> String {\n    server\n        .parse::<std::net::SocketAddr>()\n        .map(|address| address.ip().to_string())\n        .unwrap_or_else(|_| server.to_string())\n}\n'''
          if host_old not in client:
              raise SystemExit('server_host block missing')
          client = client.replace(host_old, host_new, 1)
          client_path.write_text(client)

          protocol_doc = Path('PROTOCOL.md')
          protocol_doc.write_text('''# UDP protocol\n\nDefault port: **34254/UDP**.\n\nPackets are UTF-8 text datagrams terminated by `\\n`. The server is authoritative: clients send movement intent and accumulated mouse-look deltas, not trusted world coordinates.\n\n## Client -> server\n\n```text\nJOIN|<username>\nINPUT|<sequence>|<forward>|<strafe>|<keyboard_turn>|<mouse_look_delta>\nSHOOT|<sequence>\nPING\nNEXT\nSETLEVEL|<level_index>\nCUSTOM|<width>|<height>|<seed>|<wall_bits>\nLEAVE\n```\n\nMovement axes are clamped to `[-1, 1]`. `mouse_look_delta` is an accumulated angular impulse in radians since the previous INPUT packet, so mouse sensitivity is independent of render FPS. Usernames are reduced to 16 protocol-safe ASCII characters.\n\nCustom mazes are bounded to odd dimensions from 7 through 31 and use one `0`/`1` bit per cell. The server validates them, installs them as level index 3, and broadcasts the maze to every client.\n\n## Server -> client\n\n```text\nWELCOME|<player_id>|<level_index>|<spawn_x>|<spawn_y>\nSTATE|<tick>|<level_index>|<player>;<player>;...\nSHOT|<shooter_id>|<target_id_or_0>\nLEVEL|<level_index>\nCUSTOMLEVEL|<width>|<height>|<seed>|<wall_bits>\nPONG\nREJECT|<reason>\n```\n\nA player inside `STATE` is:\n\n```text\nid,name,x,y,angle,health,score,is_bot\n```\n\nThe server simulates at **60 Hz** and broadcasts world snapshots every two ticks (**30 Hz**). Client rendering is independent of the network tick rate and interpolates remote players.\n\n## UDP behaviour\n\n- `PING` / input packets refresh the player's timeout.\n- Clients are dropped after 5 seconds without activity.\n- A repeated `JOIN` from the same socket returns the existing `WELCOME` packet, which makes the initial handshake tolerant of UDP packet loss.\n- If the active level is custom, the server also sends its maze payload during the handshake.\n- Old snapshots are ignored by the client using the server tick number.\n- The server accepts up to 64 network clients, exceeding the subject minimum of 10.\n''')

          readme = Path('README.md').read_text()
          readme = readme.replace(
              '- Mouse look, left-click/Space fire, reload and weapon HUD.',
              '- Frame-rate-independent mouse look, left-click/Space fire and weapon HUD.',
          )
          readme = readme.replace(
              '- Native level editor and procedural maze generation.',
              '- Native level editor, procedural maze generation and playable custom mazes.',
          )
          readme = readme.replace('| `R` | Reload |\n', '')
          readme = readme.replace(
              'Use the top bar for built-in levels, procedural generation, gateway, editor, scoreboard and settings.',
              'Use the top bar for built-in levels, procedural generation, the saved custom maze, scoreboard and settings. Gateway/editor actions do not disconnect a live match; use `Esc` to leave the server and edit maps from the connection screen.',
          )
          readme = readme.replace(
              '- `Esc`: return.\n',
              '- `Esc`: return.\n\nAfter saving, connect to the server and press **CUSTOM** in the game header. The maze is sent to the authoritative server and broadcast to all connected clients. **PROCEDURAL** generates and activates a fresh networked custom maze without disconnecting.\n',
          )
          Path('README.md').write_text(readme)

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: dtolnay/rust-toolchain@1.74.0

      - name: Validate Rust 1.74
        run: |
          cargo +1.74.0 check --all-targets --locked
          cargo +1.74.0 test --locked

      - name: Validate stable
        run: |
          cargo +stable fmt --all
          cargo +stable fmt --all -- --check
          cargo +stable test --locked
          cargo +stable clippy --all-targets --locked -- -D warnings
          RUSTFLAGS=-Dwarnings cargo +stable build --release --bins --locked

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src README.md PROTOCOL.md
          git commit -m "fix: stabilize native input and custom levels"
          git push origin HEAD:input-fixes
