name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo check --all-targets
      - name: Test library
        run: cargo test --lib
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
