name: Native display fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/display-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply display fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/bin/client.rs")
          text = path.read_text()

          old = '''        high_dpi: false,
        window_resizable: true,
        ..Default::default()
'''
          new = '''        high_dpi: true,
        fullscreen: true,
        window_resizable: true,
        ..Default::default()
'''
          if old not in text:
              raise SystemExit("window config pattern not found")
          text = text.replace(old, new, 1)

          old = '''    set_cursor_grab(false);
    show_mouse(true);

    loop {
        clear_background(Color::new(0.008, 0.011, 0.02, 1.0));
'''
          new = '''    set_cursor_grab(false);
    show_mouse(true);
    let mut fullscreen = true;

    loop {
        if is_key_pressed(KeyCode::F11) {
            fullscreen = !fullscreen;
            set_fullscreen(fullscreen);
        }
        clear_background(Color::new(0.008, 0.011, 0.02, 1.0));
'''
          if old not in text:
              raise SystemExit("main loop pattern not found")
          text = text.replace(old, new, 1)

          path.write_text(text)

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@1.74.0

      - name: Format
        run: cargo +stable fmt --all
      - name: Rust 1.74 check
        run: cargo +1.74.0 check --locked --all-targets
      - name: Test
        run: cargo +stable test --locked
      - name: Clippy
        run: cargo +stable clippy --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo +stable build --release --locked --bin server --bin client

      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/workflows/display-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/client.rs .github/workflows/display-fix.yml
          git commit -m "fix: enable crisp fullscreen native rendering"
          git push origin HEAD:main
