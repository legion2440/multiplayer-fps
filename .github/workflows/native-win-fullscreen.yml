name: Native Windows fullscreen fix
# retry after correcting Cargo marker

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-win-fullscreen.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply fixes
        run: python3 .github/scripts/fix_native_win.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@1.74.0

      - name: Format
        run: cargo +stable fmt --all
      - name: Rust 1.74 check
        run: cargo +1.74.0 check --locked --all-targets
      - name: Test
        run: cargo +stable test --locked
      - name: Clippy
        run: cargo +stable clippy --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo +stable build --release --locked --bin server --bin client
      - name: Windows type-check
        run: |
          rustup target add x86_64-pc-windows-gnu --toolchain 1.74.0
          cargo +1.74.0 check --locked --target x86_64-pc-windows-gnu --bin client

      - name: Commit validated fix
        run: |
          rm .github/workflows/native-win-fullscreen.yml
          rm .github/scripts/fix_native_win.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml src/bin/client.rs .github/workflows/native-win-fullscreen.yml .github/scripts/fix_native_win.py
          git commit -m "fix: enforce native Windows fullscreen"
          git push origin HEAD:main
