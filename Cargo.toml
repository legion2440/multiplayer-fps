[package]
name = "multiplayer-fps"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
default-run = "client"

[dependencies]
macroquad = "=0.4.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"
